<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111318"><meta name="description" content="Giato AI — مساعدك الذكي"><title>Giato AI</title><link rel="stylesheet" href="/style.css"></head><body><aside class="sidebar"><div class="brand"><span class="brand-icon">✳</span><span>Giato AI</span></div><button id="new-chat" class="new-chat">＋ محادثة جديدة</button><div class="side-note">مساعدك الذكي، في أي وقت.</div><div class="side-bottom">نسخة مفتوحة المصدر</div></aside><main class="main"><header class="topbar"><div class="mobile-brand">✳ Giato AI</div><span class="status-dot"></span><span>مساعد ذكي</span></header><section id="chat-area" class="chat-area"><div id="welcome" class="welcome"><div class="welcome-icon">✳</div><h1>كيف أقدر أساعدك <span>اليوم؟</span></h1><p>اسأل، تعلّم، واكتشف أفكارًا جديدة.</p><div class="suggestions"><button data-prompt="علّمني أساسيات البرمجة من الصفر">⌘ <span>تعلّم البرمجة</span></button><button data-prompt="اقترح أفكار مشاريع تقنية أقدر أبدأ بها">✧ <span>أفكار إبداعية</span></button><button data-prompt="اكتب لي رسالة احترافية قصيرة">✎ <span>الكتابة والصياغة</span></button><button data-prompt="اشرح لي الذكاء الاصطناعي ببساطة">◉ <span>اسأل وتعلّم</span></button></div></div><div id="messages" class="messages"></div></section><form id="chat-form" class="composer"><textarea id="prompt" rows="1" maxlength="12000" placeholder="اكتب رسالتك هنا..."></textarea><button id="send" type="submit" aria-label="إرسال">↑</button></form><footer>قد يخطئ الذكاء الاصطناعي؛ راجع المعلومات المهمة دائمًا.</footer></main><script src="/app.js"></script></body></html>
